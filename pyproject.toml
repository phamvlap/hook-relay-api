[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project]
name = "hook-relay-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.20.0",
  "anyio>=4.15.1",
  "asyncpg>=0.31.0",
  "celery>=5.6.3",
  "cryptography>=50.0.1",
  "fastapi[standard]>=0.141.1",
  "flower>=2.2.0",
  "httpx>=0.28.1",
  "orjson>=3.12.0",
  "psycopg2-binary>=2.9.13",
  "pydantic-settings>=2.15.0",
  "python-dotenv>=1.2.3",
  "redis>=8.1.0",
  "rich>=15.0.0",
  "sqlalchemy>=2.0.52",
  "typer>=0.12.0",
  "uvicorn[standard]>=0.52.4",
]

[project.scripts]
hook-relay-cli = "src.cli:main"

[tool.pyright]
extraPaths = ["."]

[dependency-groups]
dev = [
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.16.0",
  "ruff>=0.16.10",
]
