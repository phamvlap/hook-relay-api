[pytest]
testpaths = tests
python_files = test_*.py tests.py *_test.py
python_functions = test_*
python_classes = Test*

# Automatically handle async test functions and fixtures without needing @pytest.mark.asyncio everywhere
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Fail on warnings, exclude external cache dirs
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:UserWarning
    ignore:.*Exception ignored in.*socket\.socket.*:pytest.PytestUnraisableExceptionWarning
    ignore:.*unclosed.*<socket\.socket.*:ResourceWarning
norecursedirs = .git .venv venv build dist

# Output options
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
markers =
    unit: Fast, isolated unit tests without DB or external network
    integration: Tests interacting with database, redis, or filesystem
    api: API route and HTTP contract tests
    slow: Long-running or heavy load tests
